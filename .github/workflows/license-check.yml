name: license-check
on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  spdx-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Check SPDX license headers
        run: python .github/scripts/check_license_headers.py
