name: ci
on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

# One deploy at a time: two merges in quick succession otherwise both fetch the
# same gh-pages commit and the second push is rejected as non-fast-forward.
# A newer queued run replaces an older one; it builds the newer main anyway.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name "El1as42"
          git config user.email "90044345+El1as42@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install Material for MkDocs
        run: | 
          pip install -r requirements-docs.txt

      # Without a local gh-pages branch, gh-deploy builds a parentless commit
      # that can only be force-pushed, which the "Protect gh-pages" ruleset
      # rejects. With it, the deploy commit fast-forwards the branch.
      - name: Fetch gh-pages
        run: git fetch origin gh-pages:gh-pages

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy