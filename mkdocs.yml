site_name: BirdBox
site_description: Deep learning bird call detection and evaluation with YOLO-based acoustic models
site_author: BirdNET-Team
site_url: https://birdnet-team.github.io/BirdBox/

repo_name: birdnet-team/BirdBox
repo_url: https://github.com/birdnet-team/BirdBox

copyright: Copyright &copy; 2026 BirdNET-Team

theme:
  name: material
  logo: img/logo_birdbox.png
  favicon: img/logo_birdbox.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            show_category_heading: true
            heading_level: 3
            members_order: source
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - footnotes

extra_css:
  - stylesheets/onnx_demo.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.number.min.js
  - javascripts/tablesort.js
  - https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js
  - javascripts/onnx_spectrogram.js
  - javascripts/onnx_demo.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Demo Streamlit: getting-started/demo_streamlit.md
      - Demo ONNX: getting-started/demo_onnx.md
  - How It Works:
      - Algorithm Overview: how-it-works/overview.md
      - Spectrogram Generation: how-it-works/spectrogram.md
      - Troubleshooting: how-it-works/trouble.md
  - Data In/Out:
      - File Flows: data/fileflows.md
      - "In: Audio and Model": data/audio-and-model.md
      - "In: Ground Truth Labels": data/annotations.md
      - "Out: Detection Output Formats": data/outputs.md
  - Models and Metrics:
      - Overview: models-and-metrics/overview.md
      - All-in-One: models-and-metrics/all-in-one.md
      - All-in-One-Model-Types: models-and-metrics/all-in-one-model-types.md
      - Just-Bird: models-and-metrics/just-bird.md
      - Just-Bird-Model-Types: models-and-metrics/just-bird-model-types.md
      - Amazon-Basin: models-and-metrics/amazon-basin.md
      - Hawaii: models-and-metrics/hawaii.md
      - Northeastern-US: models-and-metrics/northeastern-us.md
      - Southern-Sierra-Nevada: models-and-metrics/southern-sierra-nevada.md
      - Western-US: models-and-metrics/western-us.md
  - CLI Reference:
      - Typical Workflows: cli/workflows.md
      - Detecting Birds: cli/detect-birds.md
      - F-Beta Score Analysis: cli/f-beta-score-analysis.md
      - Filter and Merge Detections: cli/filter-and-merge-detections.md
      - Confusion Matrix Analysis: cli/confusion-matrix-analysis.md
  - API Reference:
      - API Type: api/api-type.md
      - Python Workflows: api/workflows.md
      - BirdCallDetector: api/detect-birds.md
      - FBetaScoreAnalyzer: api/f-beta-score-analysis.md
      - DetectionFilter: api/filter-and-merge-detections.md
      - ConfusionMatrixAnalyzer: api/confusion-matrix-analysis.md